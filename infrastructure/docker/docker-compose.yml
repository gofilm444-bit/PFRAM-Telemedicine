services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pfram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pfram_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-pfram_db}
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: [pfram-postgres:/var/lib/postgresql/data]
    healthcheck:
      {
        test:
          ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pfram_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pfram_minio_dev_only}
    ports: ["9000:9000", "9001:9001"]
    volumes: [pfram-minio:/data]
    healthcheck:
      {
        test: ["CMD", "mc", "ready", "local"],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
  minio-bootstrap:
    image: minio/mc:latest
    profiles: ["bootstrap"]
    depends_on: { minio: { condition: service_healthy } }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pfram_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pfram_minio_dev_only}
      MINIO_BUCKET: ${MINIO_BUCKET:-pfram-private}
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-minio.sh"]
    volumes: ["../scripts:/bootstrap:ro"]
volumes: { pfram-postgres: {}, pfram-minio: {} }
